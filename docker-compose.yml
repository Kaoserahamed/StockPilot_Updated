services:
  # OPTIONAL legacy helper: MySQL-in-Docker for machines WITHOUT native MySQL.
  # LOCAL RUN (this laptop): use NATIVE MySQL directly — DO NOT `docker compose up` this file.
  # DEPLOY: use docker-compose.prod.yml (Postgres), NOT this file.
  #
  # SECURITY: every credential below is REQUIRED from the environment (see
  # .env.example). Bash-style expansion is used so no usable password is ever
  # committed - compose aborts with "variable is not set" instead of silently
  # starting a container with a published default.
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD (see .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pos_saas}
      MYSQL_USER: ${MYSQL_USER:-pos_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD (see .env.example)}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pos_user}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD (see .env.example)}@db:3306/${MYSQL_DATABASE:-pos_saas}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (see .env.example)}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db

volumes:
  mysql_data:

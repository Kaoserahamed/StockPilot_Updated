# =============================================================================
# StockPilot - repository-root configuration
#
# The code lives in two independently-versioned applications:
#
#     backend/   FastAPI API   - its own pyproject.toml + requirements*.txt
#     frontend/  Next.js app   - its own package.json + package-lock.json
#
# This file exists so the whole repository can be driven from the root, which
# is the first thing a fresh clone needs:
#
#     pip install -r requirements.txt         # API runtime deps (root manifest)
#     pytest                                  # backend suite, in-memory SQLite
#     pytest --cov                            # ... with the 80% floor below
#     ruff check backend/app backend/tests    # rules inherited from the backend
#
# It deliberately declares no [project] table: there is nothing to build at the
# root, and installs are driven by backend/requirements.txt, exactly what CI
# and the Makefile use.
# =============================================================================

# --------------------------------------------------------------------------- #
# pytest - `pytest` from the repository root runs the backend suite
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: tests that take noticeable time to run"]

# --------------------------------------------------------------------------- #
# coverage - the same 80% floor enforced by backend/pyproject.toml and CI
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = [
    "backend/app/main.py",
    "backend/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

# --------------------------------------------------------------------------- #
# ruff - single source of truth for lint rules is backend/pyproject.toml
# --------------------------------------------------------------------------- #
[tool.ruff]
extend = "backend/pyproject.toml"
extend-exclude = ["frontend", "node_modules"]

# --------------------------------------------------------------------------- #
# mypy - static types for the API package
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
files = ["backend/app"]
exclude = ["backend/alembic/versions"]

# Pre-commit hooks for StockPilot.
#
# Install once:      pip install pre-commit && pre-commit install
# Run on all files:  pre-commit run --all-files
# Run the test hook: pre-commit run --hook-stage manual backend-pytest
#
# The lint/format hooks mirror what CI enforces (ruff), so a local pass means a
# green CI lint job.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: debug-statements
      - id: detect-private-key

  # Ruff replaces black + isort + flake8. The rev is kept in step with the
  # `ruff` pin in backend/requirements-dev.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff (format)
        files: ^backend/

  # Frontend hygiene runs through the project's own npm scripts so ESLint and
  # Prettier config live in exactly one place.
  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$
        stages: [manual]

      - id: backend-pytest
        name: backend pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [manual]

# Proxy + TLS termination for the production compose stack.
# Mounted read-only by the `nginx` service in docker-compose.prod.yml:
#   volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
# Replace `yourdomain.com` with the real hostname and terminate TLS here
# (certbot / managed certs) — the `web` (Next.js) and `api` (FastAPI)
# services only speak plain HTTP on the internal `frontend` network.

events {}

http {
  upstream web {
    server web:3000;
  }

  upstream api {
    server api:8000;
  }

  # HTTP -> HTTPS redirect (enable once TLS certificates are installed).
  # server {
  #   listen 80;
  #   server_name yourdomain.com;
  #   return 301 https://$host$request_uri;
  # }

  server {
    listen 80;
    server_name yourdomain.com;

    # Security headers on every response.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 10m;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
